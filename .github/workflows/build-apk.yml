name: Build ZAN APK FINAL
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup EAS
        run: npm install -g eas-cli
      - name: Install deps
        run: npm install --legacy-peer-deps
      - name: Trigger Expo Build
        run: |
          npx eas-cli build --platform android --profile preview --non-interactive --no-wait || echo "Build triggered"
          exit 0
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
